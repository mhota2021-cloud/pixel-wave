<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pixel Wave（試作）</title>
<style>
  html, body { margin: 0; height: 100%; background: #141418; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script type="module">
// 試作：Museのエンジンができるまで、動きと値を確かめるためのページ
// URLの引数で値を変えられる（例：?dot=24&hold=14&wave=6）
const q = new URLSearchParams(location.search);
const DOT = Number(q.get("dot") ?? 12);
const GAP = 2;
const HOLD = Number(q.get("hold") ?? 14) * 1000;
const WAVE = Number(q.get("wave") ?? 10) * 1000;
const COLORS = 16;
const BG = "#141418";

const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
let W, H, cols, rows;

// 乱数の種を固定できる乱数（mulberry32）
function rng(seed) {
  return () => {
    seed |= 0; seed = (seed + 0x6d2b79f5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// 色をk-means法でCOLORS色に減らし、各ドットの色を返す
function kmeans(px, k, rand) {
  const n = px.length / 3;
  const cen = [];
  for (let i = 0; i < k; i++) {
    const j = Math.floor(rand() * n) * 3;
    cen.push([px[j], px[j + 1], px[j + 2]]);
  }
  const lab = new Uint8Array(n);
  for (let it = 0; it < 12; it++) {
    for (let i = 0; i < n; i++) {
      let best = 0, bd = Infinity;
      for (let c = 0; c < k; c++) {
        const dr = px[i * 3] - cen[c][0], dg = px[i * 3 + 1] - cen[c][1], db = px[i * 3 + 2] - cen[c][2];
        const d = dr * dr + dg * dg + db * db;
        if (d < bd) { bd = d; best = c; }
      }
      lab[i] = best;
    }
    const sum = Array.from({ length: k }, () => [0, 0, 0, 0]);
    for (let i = 0; i < n; i++) {
      const s = sum[lab[i]];
      s[0] += px[i * 3]; s[1] += px[i * 3 + 1]; s[2] += px[i * 3 + 2]; s[3]++;
    }
    for (let c = 0; c < k; c++) if (sum[c][3]) cen[c] = sum[c].slice(0, 3).map(v => v / sum[c][3]);
  }
  return Array.from(lab, c => cen[c].map(Math.round));
}

// 画像を画面の縦横比で切り抜き、cols×rowsのドット絵にする
function pixelate(p) {
  const off = document.createElement("canvas");
  off.width = cols; off.height = rows;
  const o = off.getContext("2d");
  o.imageSmoothingQuality = "high";
  const iw = p.img.naturalWidth, ih = p.img.naturalHeight;
  const target = cols / rows;
  let sw = iw, sh = ih, sx = 0, sy = 0;
  if (iw / ih > target) { sw = ih * target; sx = (iw - sw) / 2; }
  else {
    sh = iw / target;
    sy = p.crop === "top" ? 0 : p.crop === "bottom" ? ih - sh : (ih - sh) / 2;
  }
  o.drawImage(p.img, sx, sy, sw, sh, 0, 0, cols, rows);
  const d = o.getImageData(0, 0, cols, rows).data;
  const px = new Float32Array(cols * rows * 3);
  for (let i = 0; i < cols * rows; i++) { px[i * 3] = d[i * 4]; px[i * 3 + 1] = d[i * 4 + 1]; px[i * 3 + 2] = d[i * 4 + 2]; }
  return kmeans(px, COLORS, rng(1));
}

function rgb(c) { return `rgb(${c[0]},${c[1]},${c[2]})`; }
function glow(c) { return rgb(c.map(v => Math.round(v + (255 - v) * 0.6))); }

function cell(i, color) {
  ctx.fillStyle = color;
  ctx.fillRect((i % cols) * DOT + GAP / 2, Math.floor(i / cols) * DOT + GAP / 2, DOT - GAP, DOT - GAP);
}

function drawAll(grid) {
  ctx.fillStyle = BG;
  ctx.fillRect(0, 0, W, H);
  grid.forEach((c, i) => cell(i, rgb(c)));
}

const credits = await (await fetch("../assets/paintings/credits.json")).json();
const paintings = (await Promise.all(credits.map(c => new Promise(res => {
  const img = new Image();
  img.onload = () => res({ ...c, img });
  img.onerror = () => { console.warn("読み込みに失敗した:", c.file); res(null); };
  img.src = "../assets/paintings/" + c.file;
})))).filter(Boolean);

let grids = [];
let order = [];
let curIdx = -1;
let timer = 0, raf = 0;

function nextIndex() {
  if (order.length === 0) {
    order = paintings.map((_, i) => i);
    for (let i = order.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [order[i], order[j]] = [order[j], order[i]];
    }
    if (order[0] === curIdx && order.length > 1) [order[0], order[1]] = [order[1], order[0]];
  }
  return order.shift();
}

function setup() {
  const dpr = devicePixelRatio || 1;
  W = innerWidth; H = innerHeight;
  canvas.width = W * dpr; canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  cols = Math.ceil(W / DOT); rows = Math.ceil(H / DOT);
  grids = paintings.map(pixelate);
}

// 画面の外周上のランダムな点から、次の絵の波を広げる
function transition() {
  clearTimeout(timer);
  cancelAnimationFrame(raf);
  const from = grids[curIdx];
  const toIdx = nextIndex();
  const to = grids[toIdx];
  const per = 2 * (W + H);
  let t = Math.random() * per, ox, oy;
  if (t < W) { ox = t; oy = 0; }
  else if ((t -= W) < H) { ox = W; oy = t; }
  else if ((t -= H) < W) { ox = W - t; oy = H; }
  else { ox = 0; oy = H - (t - W); }
  const rmax = Math.max(Math.hypot(ox, oy), Math.hypot(W - ox, oy), Math.hypot(ox, H - oy), Math.hypot(W - ox, H - oy)) + DOT;
  const dist = new Float32Array(cols * rows);
  for (let i = 0; i < cols * rows; i++) {
    dist[i] = Math.hypot((i % cols) * DOT + DOT / 2 - ox, Math.floor(i / cols) * DOT + DOT / 2 - oy);
  }
  const state = new Uint8Array(cols * rows); // 0：前の絵、1：光る輪、2：次の絵
  const band = DOT * 1.5;
  const start = performance.now();
  const step = now => {
    const p = Math.min(1, (now - start) / WAVE);
    const r = rmax * (0.5 - Math.cos(Math.PI * p) / 2);
    for (let i = 0; i < cols * rows; i++) {
      const s = dist[i] >= r ? 0 : dist[i] >= r - band ? 1 : 2;
      if (s !== state[i]) {
        state[i] = s;
        cell(i, s === 1 ? glow(to[i]) : rgb(to[i]));
      }
    }
    if (p < 1) raf = requestAnimationFrame(step);
    else { curIdx = toIdx; timer = setTimeout(transition, HOLD); }
  };
  raf = requestAnimationFrame(step);
}

setup();
curIdx = nextIndex();
drawAll(grids[curIdx]);
timer = setTimeout(transition, HOLD);

addEventListener("resize", () => {
  clearTimeout(timer); cancelAnimationFrame(raf);
  setup(); drawAll(grids[curIdx]);
  timer = setTimeout(transition, HOLD);
});
// 確認用：スペースか→キーで、すぐ次の絵へ
addEventListener("keydown", e => { if (e.key === " " || e.key === "ArrowRight") transition(); });
</script>
</body>
</html>
