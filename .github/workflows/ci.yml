#プルリクエストのたびにテストを3つのOSで実行する
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - name: Linuxのビルドに必要な部品を入れる
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev patchelf libxdo-dev libssl-dev

      - name: 描画エンジンのテスト
        working-directory: engine
        run: |
          npm ci
          npm test

      - name: アプリの画面の型チェック
        working-directory: app
        run: |
          npm ci
          npm run typecheck

      - name: Rustの単体テスト
        working-directory: app/src-tauri
        run: cargo test
