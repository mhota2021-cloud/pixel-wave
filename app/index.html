<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pixel Wave</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23141418'/%3E%3Crect x='2' y='2' width='5' height='5' fill='%233a6ea5'/%3E%3Crect x='9' y='9' width='5' height='5' fill='%23c9a227'/%3E%3C/svg%3E" />
  </head>
  <body>
    <main class="app">
      <section class="preview">
        <canvas id="previewCanvas"></canvas>
      </section>
      <section class="listSection">
        <div class="listBar">
          <button id="addButton" class="addButton" type="button" aria-label="画像を追加">＋</button>
        </div>
        <div id="grid" class="grid"></div>
      </section>
      <footer class="actions">
        <button id="wallpaperButton" class="primary" type="button">壁紙にする</button>
        <button id="fullscreenButton" class="primary" type="button" hidden>全画面で表示</button>
        <button id="saverButton" class="normal" type="button">スクリーンセーバーにする</button>
      </footer>
      <div class="creditsBar">
        <button id="creditsButton" class="creditsButton" type="button">出典</button>
      </div>
      <section id="creditsPanel" class="creditsPanel" hidden></section>
    </main>
    <input id="fileInput" type="file" accept="image/jpeg,image/png,image/webp" multiple hidden />
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
