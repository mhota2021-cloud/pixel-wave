<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Pixel Wave</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
<script src="pixelwave://saver/paintings.js"></script>
</head>
<body>
<canvas id="screen"></canvas>
<script type="module">
  import { createEngine } from "./engine.js";
  const list = Array.isArray(window.PIXELWAVE_PAINTINGS) ? window.PIXELWAVE_PAINTINGS : [];
  const engine = createEngine(document.getElementById("screen"), list);
  engine.start();
  window.addEventListener("pagehide", () => engine.destroy());
</script>
</body>
</html>
